name: Build PSP EBOOT

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSPDEV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkgconf libusb-0.1-4 \
            libarchive-tools fakeroot wget
          sudo apt-get install -y libreadline8t64 libgpgme11t64 \
            || sudo apt-get install -y libreadline8 libgpgme11

          wget -q \
            https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz \
            -O /tmp/pspdev.tar.gz
          sudo rm -rf /opt/pspdev
          sudo tar -xzf /tmp/pspdev.tar.gz -C /opt

          echo "PSPDEV=/opt/pspdev" >> "$GITHUB_ENV"
          echo "/opt/pspdev/bin" >> "$GITHUB_PATH"
          export PATH="/opt/pspdev/bin:$PATH"
          psp-config --pspdev-path
          psp-gcc --version | head -n 1

      - name: Build EBOOT
        shell: bash
        run: |
          export PATH="/opt/pspdev/bin:$PATH"
          make

      - name: Package PSP folder
        shell: bash
        run: |
          mkdir -p JadePath
          cp EBOOT.PBP JadePath/EBOOT.PBP
          cp README-PSP.txt JadePath/README-PSP.txt
          ls -lh JadePath

      - name: Upload EBOOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadePath-PSP
          path: JadePath
          if-no-files-found: error
